<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>Azkar & Dua — Tolaanfur</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Inter:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#060818;--card:rgba(20,30,100,.4);--bdr:rgba(100,140,255,.18);--text:#EEF2FF;--muted:#718096;
  --b3:#00BFFF;--pu:#6B3FFF;--pu2:#9B6FFF;--gold:#F59E0B;--gr:#10B981;--rd:#F43F5E}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:Inter,sans-serif;overflow:hidden}
#app{height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;align-items:center;padding:0 1rem 2rem}
.screen{width:100%;max-width:560px}

/* Kop */
.kop{position:sticky;top:0;z-index:20;width:calc(100% + 2rem);margin:0 -1rem;background:rgba(6,8,24,.92);backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(100,140,255,.1);display:flex;align-items:center;gap:.6rem;padding:max(env(safe-area-inset-top),.7rem) 1rem .7rem}
.terug{width:2.3rem;height:2.3rem;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid var(--bdr);
  display:grid;place-items:center;font-size:1rem;cursor:pointer;flex-shrink:0}
.kop-t{font-family:'Fredoka One',cursive;font-size:1.05rem}
.kop-sub{font-size:.68rem;color:var(--muted)}

/* Snel-blok */
.snel{background:linear-gradient(135deg,rgba(107,63,255,.25),rgba(0,191,255,.12));border:1px solid rgba(155,111,255,.35);
  border-radius:1.1rem;padding:1rem;margin-top:1rem;cursor:pointer}
.snel-t{font-family:'Fredoka One',cursive;font-size:1rem;display:flex;align-items:center;gap:.4rem}
.snel-d{font-size:.75rem;color:var(--muted);margin-top:.2rem}

.sectie-t{font-family:'Fredoka One',cursive;font-size:1rem;margin:1.4rem 0 .7rem;display:flex;align-items:center;gap:.4rem}

/* Momenten-kaarten */
.moment{background:var(--card);border:1px solid var(--bdr);border-radius:1rem;padding:.85rem;margin-bottom:.6rem;
  display:flex;align-items:center;gap:.75rem;cursor:pointer;transition:transform .12s}
.moment:active{transform:scale(.98)}
.moment-ico{width:2.8rem;height:2.8rem;border-radius:.8rem;display:grid;place-items:center;font-size:1.35rem;flex-shrink:0}
.moment-mid{flex:1;min-width:0}
.moment-t{font-weight:700;font-size:.92rem}
.moment-d{font-size:.68rem;color:var(--muted);margin-top:.1rem}
.moment-voort{font-size:.64rem;color:var(--b3);font-weight:700;margin-top:.25rem}
.moment-check{font-size:1.1rem;flex-shrink:0}

/* Voortgang vandaag */
.voort-kaart{background:var(--card);border:1px solid var(--bdr);border-radius:1rem;padding:1rem;margin-top:.5rem}
.voort-rij{display:flex;align-items:center;justify-content:space-between;padding:.4rem 0;font-size:.85rem}
.voort-bar{height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:.6rem}
.voort-vul{height:100%;background:linear-gradient(90deg,var(--pu),var(--b3));transition:width .5s}
.voort-tel{font-size:.72rem;color:var(--muted);text-align:center;margin-top:.5rem}

/* Categorie-tegels */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.cat{background:var(--card);border:1px solid var(--bdr);border-radius:1rem;padding:.9rem;cursor:pointer;transition:transform .12s}
.cat:active{transform:scale(.97)}
.cat-ico{font-size:1.5rem}
.cat-t{font-weight:700;font-size:.88rem;margin-top:.4rem}
.cat-n{font-size:.66rem;color:var(--muted);margin-top:.1rem}

/* Zoeken */
.zoek{width:100%;background:rgba(255,255,255,.06);border:1.5px solid var(--bdr);border-radius:.9rem;padding:.7rem 1rem;
  color:var(--text);font-size:.88rem;font-family:Inter,sans-serif;outline:none;margin-top:1rem}
.zoek:focus{border-color:var(--b3)}

/* Lijstitem */
.dhikr-item{background:var(--card);border:1px solid var(--bdr);border-radius:.9rem;padding:.85rem;margin-bottom:.55rem;
  display:flex;align-items:center;gap:.6rem;cursor:pointer}
.dhikr-item-mid{flex:1;min-width:0}
.dhikr-item-t{font-weight:700;font-size:.88rem}
.dhikr-item-b{font-size:.64rem;color:var(--muted);margin-top:.15rem}
.dhikr-fav{font-size:1.1rem;cursor:pointer;flex-shrink:0}

/* Zikr Journey — detailscherm */
.journey{width:100%;max-width:560px;margin-top:1rem}
.j-voortgang{display:flex;align-items:center;justify-content:center;gap:.35rem;margin-bottom:1rem;flex-wrap:wrap}
.j-stip{width:.6rem;height:.6rem;border-radius:50%;background:rgba(255,255,255,.2)}
.j-stip.done{background:var(--gr)}
.j-stip.nu{background:var(--b3);transform:scale(1.3)}
.j-stap-tel{font-size:.75rem;color:var(--muted);text-align:center;margin-bottom:.5rem}
.j-kaart{background:var(--card);border:1px solid var(--bdr);border-radius:1.2rem;padding:1.3rem 1.1rem}
.j-titel{font-family:'Fredoka One',cursive;font-size:1.05rem;text-align:center;margin-bottom:1rem;display:flex;align-items:center;justify-content:center;gap:.4rem}
.j-arab{font-family:'Amiri',serif;font-size:1.75rem;line-height:2.6;text-align:right;direction:rtl;color:#fff;
  padding:1rem;background:rgba(255,255,255,.03);border-radius:.9rem;margin-bottom:.9rem}
.j-translit{font-size:.85rem;font-style:italic;color:var(--pu2);line-height:1.6;margin-bottom:.7rem;text-align:center}
.j-vert{font-size:.92rem;line-height:1.6;color:var(--text);text-align:center;margin-bottom:.9rem}
.j-bron{font-size:.7rem;color:var(--muted);text-align:center;padding-top:.7rem;border-top:1px solid var(--bdr)}
.j-aantal{display:flex;align-items:center;justify-content:center;gap:.5rem;margin:1rem 0;font-size:.85rem;color:var(--muted)}
.j-teller{font-family:'Fredoka One',cursive;font-size:1.5rem;color:var(--b3);min-width:2.5rem;text-align:center}
.j-tel-knop{width:100%;padding:1rem;border:none;border-radius:1rem;background:linear-gradient(135deg,var(--pu),var(--pu2));
  color:#fff;font-family:'Fredoka One',cursive;font-size:1rem;cursor:pointer;margin-top:.5rem}
.j-tel-knop:active{transform:scale(.98)}
.j-klaar{background:linear-gradient(135deg,var(--gr),#34D399)}
.j-nav{display:flex;gap:.6rem;margin-top:.8rem}
.j-nav button{flex:1;padding:.7rem;border-radius:.8rem;border:1px solid var(--bdr);background:rgba(255,255,255,.05);
  color:var(--text);font-family:Inter,sans-serif;font-weight:700;font-size:.82rem;cursor:pointer}
.j-instel{display:flex;align-items:center;justify-content:center;gap:.5rem;margin-top:.8rem;font-size:.75rem;color:var(--muted)}
.j-toggle{cursor:pointer;color:var(--b3);font-weight:700}

/* Tabbladen onderin de module */
.mtabs{display:flex;gap:.4rem;width:100%;max-width:560px;margin-top:1rem;position:sticky;bottom:0;
  background:rgba(6,8,24,.92);backdrop-filter:blur(10px);padding:.5rem 0 max(env(safe-area-inset-bottom),.5rem)}
.mtab{flex:1;text-align:center;padding:.5rem;border-radius:.7rem;font-size:.72rem;font-weight:700;cursor:pointer;color:var(--muted);background:rgba(255,255,255,.04)}
.mtab.on{background:rgba(107,63,255,.2);color:#C4B5FD}

.leeg{text-align:center;padding:3rem 1rem;color:var(--muted)}
.leeg-ico{font-size:2.5rem}
.bijna{display:inline-block;font-size:.6rem;background:rgba(245,158,11,.2);color:var(--gold);border:1px solid rgba(245,158,11,.4);
  border-radius:2rem;padding:.1rem .5rem;margin-left:.4rem;vertical-align:middle}
.instel-rij{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--bdr);
  border-radius:.8rem;padding:.75rem .9rem;margin-bottom:.5rem}
.schakel{width:2.8rem;height:1.6rem;border-radius:1rem;background:rgba(255,255,255,.15);position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.schakel.aan{background:var(--gr)}
.schakel::after{content:'';position:absolute;top:.15rem;left:.15rem;width:1.3rem;height:1.3rem;border-radius:50%;background:#fff;transition:left .2s}
.schakel.aan::after{left:1.35rem}
.tijd-inp{background:rgba(255,255,255,.08);border:1px solid var(--bdr);border-radius:.5rem;color:#fff;padding:.35rem .5rem;font-size:.8rem;font-family:Inter,sans-serif}
</style>
</head>
<body>
<div id="app">
  <div class="kop">
    <div class="terug" onclick="terug()">←</div>
    <div style="flex:1"><div class="kop-t">📿 Azkar & Dua</div><div class="kop-sub" id="kopSub">My daily remembrance</div></div>
  </div>
  <div id="inhoud" class="screen"><div class="leeg"><div class="leeg-ico">📿</div><div style="margin-top:.5rem">Loading...</div></div></div>
</div>

<script>
// ══ GEGEVENS ══
var DATA = null;          // uit adhkar.json
var tab = 'home';         // home | bibliotheek | favorieten | instellingen
var journey = null;       // {lijst, index, titel} als een routine loopt
var teller = 0;           // huidige teller in de journey
var zoekterm = '';
var taal = localStorage.getItem('tf_azkar_taal') || 'en';   // 'en' of 'nl'
var translitAan = localStorage.getItem('tf_azkar_translit') !== '0';

function laad(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function bewaar(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var favs = laad('tf_azkar_favs', {});          // {id:true}
var voortgang = laad('tf_azkar_voortgang', {}); // {datum: {routine:true}}
var meldingen = laad('tf_azkar_meld', {ochtend:true, avond:true, naSalah:true, slapen:true,
  tijden:{ochtend:'06:30', avond:'18:00', slapen:'22:00'}});

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function vandaag(){return new Date().toISOString().slice(0,10);}

function terug(){
  if(journey){ journey=null; render(); return; }
  try{ if(window.parent&&window.parent!==window) window.parent.postMessage('go-home','*'); }catch(e){}
}

// ══ INLADEN ══
fetch('azkar/adhkar.json',{cache:'no-cache'})
  .then(function(r){return r.json();})
  .then(function(d){ DATA=d; render(); })
  .catch(function(){
    document.getElementById('inhoud').innerHTML='<div class="leeg"><div class="leeg-ico">📿</div>'
      +'<div style="margin-top:.5rem">Could not load the adhkar file.</div>'
      +'<div style="font-size:.75rem;margin-top:.3rem">Make sure azkar/adhkar.json is uploaded.</div></div>';
  });

function tekst(o, veld){
  // Kies de vertaling in de gekozen taal, val terug op Engels
  if(taal==='nl' && o[veld+'_nl']) return o[veld+'_nl'];
  return o[veld+'_en'] || o[veld+'_nl'] || '';
}
function catNaam(c){ return taal==='nl' ? (c.nl||c.en) : c.en; }
function routineNaam(r){ return taal==='nl' ? (r.nl||r.en) : r.en; }

function adhkarVan(filterFn){ return (DATA.adhkar||[]).filter(filterFn); }
function routineLijst(code){ return adhkarVan(function(a){return a.routine===code;}); }

// ══ WEERGAVE ══
function render(){
  if(!DATA) return;
  if(journey){ renderJourney(); return; }
  var el = document.getElementById('inhoud');
  if(tab==='home') el.innerHTML = rHome();
  else if(tab==='bibliotheek') el.innerHTML = rBibliotheek();
  else if(tab==='favorieten') el.innerHTML = rFavorieten();
  else if(tab==='instellingen') el.innerHTML = rInstellingen();
  el.innerHTML += rTabs();
  koppel();
}

function rTabs(){
  function t(code,ico,label){ return '<div class="mtab'+(tab===code?' on':'')+'" data-tab="'+code+'">'+ico+'<br>'+label+'</div>'; }
  return '<div class="mtabs">'+t('home','🏠','Home')+t('bibliotheek','📚','Library')+t('favorieten','❤️','Favourites')+t('instellingen','⚙️','Settings')+'</div>';
}

function rHome(){
  var d = vandaag();
  var vColl = voortgang[d] || {};
  var routines = DATA.routines || [];
  var gedaan = routines.filter(function(r){return vColl[r.code];}).length;

  var html = '';

  // Snel
  html += '<div class="snel" data-snel="1">'
    +'<div class="snel-t">⚡ Quick — "I have 2 minutes"</div>'
    +'<div class="snel-d">A few short, powerful adhkar for a quick moment of remembrance.</div></div>';

  // Momenten
  html += '<div class="sectie-t">📿 My daily Zikr</div>';
  routines.forEach(function(r){
    var lijst = routineLijst(r.code);
    var klaar = vColl[r.code];
    html += '<div class="moment" data-routine="'+r.code+'">'
      +'<div class="moment-ico" style="background:rgba(107,63,255,.2)">'+r.icon+'</div>'
      +'<div class="moment-mid"><div class="moment-t">'+esc(routineNaam(r))+'</div>'
      +'<div class="moment-d">'+esc(r.sub_en||'')+'</div>'
      +(lijst.length?'<div class="moment-voort">'+(klaar?'✓ Completed':'0 / '+lijst.length+' completed')+'</div>':'<div class="moment-voort" style="color:var(--muted)">Coming soon</div>')
      +'</div>'
      +'<div class="moment-check">'+(klaar?'✅':'›')+'</div></div>';
  });

  // Voortgang vandaag
  html += '<div class="sectie-t">📊 Today</div>';
  html += '<div class="voort-kaart">';
  routines.forEach(function(r){
    html += '<div class="voort-rij"><span>'+r.icon+' '+esc(routineNaam(r))+'</span><span>'+(vColl[r.code]?'✅':'⬜')+'</span></div>';
  });
  var pct = routines.length ? Math.round(gedaan/routines.length*100) : 0;
  html += '<div class="voort-bar"><div class="voort-vul" style="width:'+pct+'%"></div></div>';
  html += '<div class="voort-tel">'+gedaan+' / '+routines.length+' moments completed today</div>';
  html += '</div>';

  return html;
}

function rBibliotheek(){
  var html = '<input class="zoek" id="zoekInp" placeholder="🔍 Search: travel, fear, sleep, protection..." value="'+esc(zoekterm)+'"/>';
  if(zoekterm){
    var t = zoekterm.toLowerCase();
    var gevonden = adhkarVan(function(a){
      return (tekst(a,'titel')+' '+tekst(a,'vertaling')+' '+(a.translit||'')).toLowerCase().indexOf(t)>=0;
    });
    html += '<div class="sectie-t">🔍 '+gevonden.length+' result'+(gevonden.length===1?'':'s')+'</div>';
    html += dhikrLijstHtml(gevonden);
    return html;
  }
  html += '<div class="sectie-t">📚 Categories</div><div class="cat-grid">';
  (DATA.categorieen||[]).forEach(function(c){
    var n = adhkarVan(function(a){return a.categorie===c.code;}).length;
    html += '<div class="cat" data-cat="'+c.code+'"><div class="cat-ico">'+c.icon+'</div>'
      +'<div class="cat-t">'+esc(catNaam(c))+'</div><div class="cat-n">'+n+' adhkar</div></div>';
  });
  html += '</div>';
  return html;
}

function rCategorie(code){
  var c = (DATA.categorieen||[]).find(function(x){return x.code===code;});
  var lijst = adhkarVan(function(a){return a.categorie===code;});
  var html = '<div class="sectie-t">'+(c?c.icon+' '+esc(catNaam(c)):'Category')+'</div>';
  html += dhikrLijstHtml(lijst);
  document.getElementById('inhoud').innerHTML = html + rTabs();
  koppel();
}

function rFavorieten(){
  var lijst = adhkarVan(function(a){return favs[a.id];});
  if(!lijst.length) return '<div class="leeg"><div class="leeg-ico">❤️</div><div style="margin-top:.5rem">No favourites yet</div>'
    +'<div style="font-size:.75rem;margin-top:.3rem">Tap the heart on any dhikr to save it here.</div></div>';
  return '<div class="sectie-t">❤️ My favourites</div>' + dhikrLijstHtml(lijst);
}

function dhikrLijstHtml(lijst){
  if(!lijst.length) return '<div class="leeg" style="padding:2rem 1rem"><div style="font-size:.85rem">Nothing here yet.</div>'
    +'<div style="font-size:.72rem;margin-top:.3rem;color:var(--muted)">Add adhkar in azkar/adhkar.json</div></div>';
  var html = '';
  lijst.forEach(function(a){
    html += '<div class="dhikr-item" data-dhikr="'+esc(a.id)+'">'
      +'<div class="dhikr-item-mid"><div class="dhikr-item-t">'+esc(tekst(a,'titel')||a.id)+'</div>'
      +'<div class="dhikr-item-b">'+esc(a.bron||'')+(a.aantal>1?' · '+a.aantal+'×':'')+'</div></div>'
      +'<div class="dhikr-fav" data-fav="'+esc(a.id)+'">'+(favs[a.id]?'❤️':'🤍')+'</div></div>';
  });
  return html;
}

// ══ ZIKR JOURNEY ══
function startRoutine(code){
  var lijst = routineLijst(code);
  if(!lijst.length){ return; }
  var r = (DATA.routines||[]).find(function(x){return x.code===code;});
  journey = {lijst:lijst, index:0, titel:routineNaam(r), icon:r.icon, routine:code};
  teller = 0;
  render();
}

function startLos(id){
  var a = (DATA.adhkar||[]).find(function(x){return x.id===id;});
  if(!a) return;
  journey = {lijst:[a], index:0, titel:tekst(a,'titel')||a.id, icon:'📿', routine:null};
  teller = 0;
  render();
}

function renderJourney(){
  var el = document.getElementById('inhoud');
  var a = journey.lijst[journey.index];
  var totaal = journey.lijst.length;
  var doel = a.aantal || 1;

  var stippen = '';
  for(var i=0;i<totaal;i++){
    stippen += '<div class="j-stip'+(i<journey.index?' done':(i===journey.index?' nu':''))+'"></div>';
  }

  var html = '<div class="journey">';
  html += '<div class="j-stap-tel">'+journey.icon+' '+esc(journey.titel)+' — step '+(journey.index+1)+' of '+totaal+'</div>';
  html += '<div class="j-voortgang">'+stippen+'</div>';
  html += '<div class="j-kaart">';
  html += '<div class="j-titel">📿 '+esc(tekst(a,'titel')||a.id)+'</div>';
  if(a.arabisch) html += '<div class="j-arab">'+esc(a.arabisch)+'</div>';
  else html += '<div class="j-arab" style="font-size:.9rem;font-family:Inter;direction:ltr;text-align:center;color:var(--muted)">(Arabic text not filled in yet)</div>';
  if(translitAan && a.translit) html += '<div class="j-translit">'+esc(a.translit)+'</div>';
  if(tekst(a,'vertaling')) html += '<div class="j-vert">'+esc(tekst(a,'vertaling'))+'</div>';
  html += '<div class="j-aantal">Repeat <span class="j-teller">'+teller+'</span> / '+doel+'</div>';
  if(a.bron) html += '<div class="j-bron">📚 '+esc(a.bron)+'</div>';
  html += '</div>';

  // Tel- of klaarknop
  if(teller < doel){
    html += '<button class="j-tel-knop" id="telKnop">Tap to count ('+teller+'/'+doel+')</button>';
  } else {
    var laatste = journey.index === totaal-1;
    html += '<button class="j-tel-knop j-klaar" id="volgKnop">'+(laatste?'✓ Finish':'✓ Next dhikr')+'</button>';
  }

  html += '<div class="j-nav">';
  html += '<button id="vorigeBtn"'+(journey.index===0?' disabled style="opacity:.4"':'')+'>← Previous</button>';
  html += '<button id="overslaanBtn">Skip →</button>';
  html += '</div>';

  // Instellingen: transliteratie en taal
  html += '<div class="j-instel">'
    +'<span class="j-toggle" id="translitToggle">'+(translitAan?'Hide':'Show')+' transliteration</span>'
    +'<span>·</span>'
    +'<span class="j-toggle" id="taalToggle">'+(taal==='en'?'Nederlands':'English')+'</span></div>';

  html += '</div>';
  el.innerHTML = html;

  var tk = document.getElementById('telKnop');
  if(tk) tk.addEventListener('click', function(){
    teller++;
    if(navigator.vibrate) navigator.vibrate(15);
    renderJourney();
  });
  var vk = document.getElementById('volgKnop');
  if(vk) vk.addEventListener('click', volgende);
  document.getElementById('vorigeBtn').addEventListener('click', function(){
    if(journey.index>0){ journey.index--; teller=0; renderJourney(); }
  });
  document.getElementById('overslaanBtn').addEventListener('click', volgende);
  document.getElementById('translitToggle').addEventListener('click', function(){
    translitAan = !translitAan; localStorage.setItem('tf_azkar_translit', translitAan?'1':'0'); renderJourney();
  });
  document.getElementById('taalToggle').addEventListener('click', function(){
    taal = taal==='en'?'nl':'en'; localStorage.setItem('tf_azkar_taal', taal); renderJourney();
  });
}

function volgende(){
  if(journey.index < journey.lijst.length-1){
    journey.index++; teller=0; renderJourney();
  } else {
    // Routine afgerond: voortgang van vandaag bijwerken
    if(journey.routine){
      var d = vandaag();
      voortgang[d] = voortgang[d] || {};
      voortgang[d][journey.routine] = true;
      bewaar('tf_azkar_voortgang', voortgang);
    }
    journey = null;
    render();
  }
}

// ══ INSTELLINGEN (interface; meldingen server-zijde komt later) ══
function rInstellingen(){
  var html = '<div class="sectie-t">⚙️ Settings</div>';

  html += '<div class="instel-rij"><div><div style="font-weight:700;font-size:.85rem">Transliteration</div>'
    +'<div style="font-size:.68rem;color:var(--muted)">Show Latin pronunciation</div></div>'
    +'<div class="schakel'+(translitAan?' aan':'')+'" id="setTranslit"></div></div>';

  html += '<div class="instel-rij"><div><div style="font-weight:700;font-size:.85rem">Translation language</div>'
    +'<div style="font-size:.68rem;color:var(--muted)">Arabic source always stays</div></div>'
    +'<select class="tijd-inp" id="setTaal"><option value="en"'+(taal==='en'?' selected':'')+'>English</option>'
    +'<option value="nl"'+(taal==='nl'?' selected':'')+'>Nederlands</option></select></div>';

  html += '<div class="sectie-t">🔔 Reminders <span class="bijna">coming soon</span></div>';
  html += '<div style="font-size:.72rem;color:var(--muted);margin-bottom:.7rem">Set your reminder times. Notifications will be activated in a future update.</div>';

  var meldRij = function(sleutel, label, heeftTijd, tijdSleutel){
    var aan = meldingen[sleutel];
    var h = '<div class="instel-rij"><div style="flex:1"><div style="font-weight:700;font-size:.85rem">'+label+'</div>';
    if(heeftTijd) h += '<input type="time" class="tijd-inp" style="margin-top:.4rem" value="'+(meldingen.tijden[tijdSleutel]||'')+'" data-tijd="'+tijdSleutel+'"/>';
    h += '</div><div class="schakel'+(aan?' aan':'')+'" data-meld="'+sleutel+'"></div></div>';
    return h;
  };
  html += meldRij('ochtend','🌅 Morning Zikr', true, 'ochtend');
  html += meldRij('avond','🌇 Evening Zikr', true, 'avond');
  html += meldRij('naSalah','🕌 After prayer', false, '');
  html += meldRij('slapen','🛏️ Before sleep', true, 'slapen');

  return html;
}

// ══ KOPPELINGEN ══
function koppel(){
  var el = document.getElementById('inhoud');

  el.querySelectorAll('[data-tab]').forEach(function(b){
    b.addEventListener('click', function(){ tab=b.getAttribute('data-tab'); zoekterm=''; render(); });
  });
  el.querySelectorAll('[data-routine]').forEach(function(b){
    b.addEventListener('click', function(){ startRoutine(b.getAttribute('data-routine')); });
  });
  var snel = el.querySelector('[data-snel]');
  if(snel) snel.addEventListener('click', startSnel);
  el.querySelectorAll('[data-cat]').forEach(function(b){
    b.addEventListener('click', function(){ rCategorie(b.getAttribute('data-cat')); });
  });
  el.querySelectorAll('[data-dhikr]').forEach(function(b){
    b.addEventListener('click', function(e){
      if(e.target.getAttribute('data-fav')!=null) return;
      startLos(b.getAttribute('data-dhikr'));
    });
  });
  el.querySelectorAll('[data-fav]').forEach(function(b){
    b.addEventListener('click', function(e){
      e.stopPropagation();
      var id=b.getAttribute('data-fav');
      if(favs[id]) delete favs[id]; else favs[id]=true;
      bewaar('tf_azkar_favs', favs);
      render();
    });
  });
  var zi = el.querySelector('#zoekInp');
  if(zi){
    zi.addEventListener('input', function(){ zoekterm=zi.value; var pos=zi.selectionStart; render();
      var n=document.getElementById('zoekInp'); if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}} });
  }

  // Instellingen
  var st=el.querySelector('#setTranslit');
  if(st) st.addEventListener('click', function(){ translitAan=!translitAan; localStorage.setItem('tf_azkar_translit',translitAan?'1':'0'); render(); });
  var sl=el.querySelector('#setTaal');
  if(sl) sl.addEventListener('change', function(){ taal=sl.value; localStorage.setItem('tf_azkar_taal',taal); render(); });
  el.querySelectorAll('[data-meld]').forEach(function(b){
    b.addEventListener('click', function(){ var k=b.getAttribute('data-meld'); meldingen[k]=!meldingen[k]; bewaar('tf_azkar_meld',meldingen); render(); });
  });
  el.querySelectorAll('[data-tijd]').forEach(function(inp){
    inp.addEventListener('change', function(){ meldingen.tijden[inp.getAttribute('data-tijd')]=inp.value; bewaar('tf_azkar_meld',meldingen); });
  });
}

function startSnel(){
  // 3–5 korte adhkar: neem er tot 5 met het laagste aantal herhalingen
  var kort = (DATA.adhkar||[]).slice().sort(function(a,b){return (a.aantal||1)-(b.aantal||1);}).slice(0,5);
  if(!kort.length) return;
  journey = {lijst:kort, index:0, titel:'Quick remembrance', icon:'⚡', routine:null};
  teller = 0;
  render();
}
</script>
